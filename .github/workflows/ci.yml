name: Synthetic reproducibility and native smoke
on: [push, pull_request]
permissions:
  contents: read
jobs:
  laboratory:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy==1.26.4 Pillow==10.2.0 ruff==0.16.10
      - run: ruff check backend/ml/generate_dataset.py tests/test_dataset_reproducibility.py
      - run: ruff format --check backend/ml/generate_dataset.py tests/test_dataset_reproducibility.py
      - run: python -m unittest discover -s tests -v
      - run: cmake -S backend/cpp -B build -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build build -j2
      - name: Synthetic normal-input smoke
        run: |
          python - <<'PY'
          import json, subprocess
          rows = ''.join(f'{day},40,200\n' for day in range(100))
          result = subprocess.run(['build/telemetry_engine'], input=rows, text=True,
                                  capture_output=True, check=True, timeout=10)
          assert json.loads(result.stdout)['status'] == 'OK'
          PY
